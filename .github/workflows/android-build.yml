name: BrokenGPT Android APK and screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - feature/approved-brokgpt-expansion
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "languages.js"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "backend/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run test:syntax
      - name: Prepare web app
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Generate launcher icons from the uploaded BrokenGPT icon
        run: |
          python3 -m venv /tmp/brokengpt-icon-venv
          /tmp/brokengpt-icon-venv/bin/pip install --quiet Pillow
          /tmp/brokengpt-icon-venv/bin/python scripts/generate-android-icons.py file_00000000a7b481f4ac6329d53b247deb.png android/app/src/main/res
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Add Maven Central mirror for transient rate limits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/settings.gradle")
          text = path.read_text()
          mirror = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2" }'
          if mirror not in text:
              text = text.replace("mavenCentral()", mirror + "\n        mavenCentral()")
              path.write_text(text)
          print("Configured Google-hosted Maven Central mirror fallback")
          PY
      - name: Build debug APK for automated checks
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK (test build only)
        uses: actions/upload-artifact@v4
        with:
          name: BrokenGPT-debug-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign release APK for installation
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$APK_DIR/app-release-unsigned.apk"
          SIGNED_APK="$APK_DIR/BrokenGPT-release.apk"
          KEYSTORE="$RUNNER_TEMP/brokengpt-release.keystore"
          STORE_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias brokengpt-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BrokenGPT Release"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias brokengpt-release \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$STORE_PASS" \
            --out "$SIGNED_APK" "$UNSIGNED_APK"
          "$APKSIGNER" verify --verbose "$SIGNED_APK"
          rm -f "$KEYSTORE"
      - name: Upload installable release APK artifact
        id: release_apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrokenGPT-release-APK
          path: android/app/build/outputs/apk/release/BrokenGPT-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download to GitHub Releases
        if: always() && steps.release_apk_artifact.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: brokengpt-build-${{ github.run_number }}
          name: BrokenGPT APK Build ${{ github.run_number }}
          body: |
            Installable signed Android APK for BrokenGPT.
            Download **BrokenGPT-release.apk** below directly—no artifact ZIP extraction.
            This build was produced from branch `feature/approved-brokgpt-expansion`.
          prerelease: true
          files: android/app/build/outputs/apk/release/BrokenGPT-release.apk
      - name: Start local preview server
        run: |
          python3 -m http.server 4173 --directory www > /tmp/brokengpt-preview.log 2>&1 &
          echo $! > /tmp/brokengpt-preview.pid
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Capture mobile app screenshots
        run: node scripts/capture-screenshots.mjs
      - name: Run browser smoke tests
        run: npm run test:smoke
      - name: Upload mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: BrokenGPT-mobile-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
