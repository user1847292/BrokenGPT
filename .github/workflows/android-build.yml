name: BrokenGPT Android APK and screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - feature/approved-brokgpt-expansion
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "languages.js"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "backend/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run test:syntax
      - name: Prepare web app
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Generate launcher icons from the uploaded BrokenGPT icon
        run: |
          python3 -m venv /tmp/brokengpt-icon-venv
          /tmp/brokengpt-icon-venv/bin/pip install --quiet Pillow
          /tmp/brokengpt-icon-venv/bin/python scripts/generate-android-icons.py file_00000000a7b481f4ac6329d53b247deb.png android/app/src/main/res
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BrokenGPT-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Start local preview server
        run: |
          python3 -m http.server 4173 --directory www > /tmp/brokengpt-preview.log 2>&1 &
          echo $! > /tmp/brokengpt-preview.pid
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Capture mobile app screenshots
        run: node scripts/capture-screenshots.mjs
      - name: Upload mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: BrokenGPT-mobile-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
