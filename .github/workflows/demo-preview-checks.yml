name: BrokenGPT checks

on:
  push:
    branches: [demo-preview]
  pull_request:
    branches: [demo-preview]
  workflow_dispatch:

jobs:
  syntax-and-backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check backend and browser JavaScript syntax
        working-directory: backend
        run: npm run check
