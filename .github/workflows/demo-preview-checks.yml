name: BrokenGPT checks

on:
  push:
    branches: [demo-preview]
  pull_request:
    branches: [demo-preview]
  workflow_dispatch:

jobs:
  syntax-and-backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check backend and browser JavaScript syntax
        working-directory: backend
        run: npm run check
      - name: Verify health endpoint and private demo gate
        working-directory: backend
        run: |
          BROKENGPT_DEMO_ACCESS_PASSWORD=ci-only-secret PORT=3100 NODE_ENV=test npm start > /tmp/brokengpt.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3100/api/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/api/health
          UNAUTH_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/)
          test "$UNAUTH_STATUS" = "401"
          curl --fail --silent --user demo:ci-only-secret http://127.0.0.1:3100/ > /dev/null
